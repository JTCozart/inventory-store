# Builds and publishes a release when a version tag is pushed.
#
#   git tag -a v26.1026.0900-rc -m "v26.1026.0900-rc"   prerelease: only servers on CHANNEL=prerelease install it
#   git tag -a v26.1026.0900 -m "v26.1026.0900"         stable: every server installs it
#   git push origin <tag>
#
# A prerelease is promoted without a rebuild: pwsh deploy/promote-release.ps1 v26.1026.0900-rc
# A tag whose commit is not on the default branch is always published as a prerelease.
#
# One release carries three downloads:
#   InventoryStore-Setup-<version>.exe               Windows installer
#   InventoryStore-linux-x64-<version>.tar.gz        for people who host it themselves (linux/install.sh, linux/update.sh)
#   inventorystore-hosted.tar.gz                     our hosted servers: the deploy kit, installed by their update timer
# The hosted name must not contain "linux-x64": linux/update.sh picks the first asset that does.
#
# This is a custom version of the kit's release-dotnet.yml (two jobs, WinForms tray). The kit scripts are the same.

name: Release

on:
  push:
    tags:
      - "v[0-9][0-9].[0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9]"
      - "v[0-9][0-9].[0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9]-rc"

env:
  # Exact version on purpose. "9.0.x" resolves through an aka.ms redirect that returned HTTP 409 on 2026-10-25 and
  # failed a release before it built anything. Bump by hand when a newer SDK is wanted.
  DOTNET_SDK: "9.0.320"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: ver
        run: |
          tag="${{ github.ref_name }}"          # v26.1026.0900 or v26.1026.0900-rc
          echo "VERSION=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ASM_VERSION=1.0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      # Gates the release. A tag pushed at a red commit fails here, before anything is published, and the
      # Windows job below needs this one, so no installer or release is made either.
      - name: Test
        run: dotnet test tests/InventoryStore.Tests/InventoryStore.Tests.csproj --configuration Release

      - name: Publish (linux-x64)
        run: |
          dotnet publish src/InventoryStore.App/InventoryStore.App.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:AssemblyVersion="${{ steps.ver.outputs.ASM_VERSION }}" \
            -p:FileVersion="${{ steps.ver.outputs.ASM_VERSION }}" \
            -p:InformationalVersion="${{ steps.ver.outputs.VERSION }}" \
            -o publish/linux-app

      - name: Stage the self-hosting archive
        run: |
          name="InventoryStore-linux-x64-${{ steps.ver.outputs.VERSION }}"
          mkdir -p "stage/$name/app"
          cp -r publish/linux-app/. "stage/$name/app/"
          cp linux/install.sh linux/update.sh linux/autobackup.sh linux/setup-autobackup.sh linux/inventorystore.service "stage/$name/"
          chmod +x "stage/$name/install.sh" "stage/$name/update.sh" "stage/$name/autobackup.sh" "stage/$name/setup-autobackup.sh" "stage/$name/app/InventoryStore.App"
          tar czf "$name.tar.gz" -C stage "$name"

      # CR is stripped so a CRLF checkout cannot break a shebang on the server.
      - name: Stage the hosted-server bundle
        run: |
          mkdir -p stage/inventorystore
          cp -r publish/linux-app/. stage/inventorystore/
          for f in install.sh autoupdate.sh setup-autodeploy.sh autobackup.sh setup-autobackup.sh preflight-backup.sh app.conf; do
            sed 's/\r$//' "deploy/$f" > "stage/inventorystore/$f"
          done
          sed 's/\r$//' linux/inventorystore.service > stage/inventorystore/inventorystore.service
          printf '%s' "${GITHUB_REF_NAME}" > stage/inventorystore/VERSION
          for f in InventoryStore.App install.sh autoupdate.sh app.conf inventorystore.service VERSION; do
            [ -s "stage/inventorystore/$f" ] || { echo "::error::Missing or empty in the hosted bundle: $f"; exit 1; }
          done
          chmod +x stage/inventorystore/InventoryStore.App
          tar czf inventorystore-hosted.tar.gz -C stage inventorystore

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarballs
          path: |
            InventoryStore-linux-x64-*.tar.gz
            inventorystore-hosted.tar.gz

  build-installer:
    runs-on: windows-latest
    needs: build-linux
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Linux tarballs
        uses: actions/download-artifact@v4
        with:
          name: linux-tarballs
          path: linux-release

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $tag    = "${{ github.ref_name }}"                  # v26.1026.0900 or v26.1026.0900-rc
          $ver    = $tag.TrimStart('v')                       # 26.1026.0900
          $asmVer = "1.0.0.${{ github.run_number }}"         # 1.0.0.42
          echo "VERSION=$ver"        >> $env:GITHUB_OUTPUT
          echo "ASM_VERSION=$asmVer" >> $env:GITHUB_OUTPUT

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          prerelease=false
          case "${{ github.ref_name }}" in *-rc) prerelease=true ;; esac
          default="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$default"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$default"; then
            echo "Tag is not on $default: marking as pre-release."
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Restore
        run: dotnet restore InventoryStore.sln

      - name: Generate icon
        shell: pwsh
        run: pwsh tools/New-Icon.ps1

      - name: Publish service (InventoryStore.App)
        shell: pwsh
        run: |
          dotnet publish src/InventoryStore.App/InventoryStore.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyVersion="${{ steps.ver.outputs.ASM_VERSION }}" `
            -p:FileVersion="${{ steps.ver.outputs.ASM_VERSION }}" `
            -p:InformationalVersion="${{ steps.ver.outputs.VERSION }}" `
            -o publish/app

      - name: Publish tray companion (InventoryStore.Tray)
        shell: pwsh
        run: |
          dotnet publish src/InventoryStore.Tray/InventoryStore.Tray.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyVersion="${{ steps.ver.outputs.ASM_VERSION }}" `
            -p:FileVersion="${{ steps.ver.outputs.ASM_VERSION }}" `
            -p:InformationalVersion="${{ steps.ver.outputs.VERSION }}" `
            -o publish/tray

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="${{ steps.ver.outputs.VERSION }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          name: ${{ steps.channel.outputs.prerelease == 'true' && format('Inventory Store {0} (pre-release)', steps.ver.outputs.VERSION) || format('Inventory Store {0}', steps.ver.outputs.VERSION) }}
          body: |
            ## Inventory Store ${{ steps.ver.outputs.VERSION }}

            ### Windows
            1. Download and run `InventoryStore-Setup-${{ steps.ver.outputs.VERSION }}.exe`
            2. The installer registers the Windows service and starts it automatically
            3. A tray icon appears at login - double-click to open the web UI

            ### Linux (Ubuntu / Debian)
            1. Download and extract `InventoryStore-linux-x64-${{ steps.ver.outputs.VERSION }}.tar.gz`
            2. Run `sudo ./install.sh` from inside the extracted folder
            3. The installer registers a systemd service and starts it automatically

            To get the newest version later, run `sudo ./update.sh`. It saves a copy of your data first, then updates everything for you.

            To have a fresh copy of your data saved automatically every night, run `sudo ./setup-autobackup.sh` once.

            The web interface is available at **http://localhost:5050** after installation.

            `inventorystore-hosted.tar.gz` is used by our own hosted servers and is not needed for the steps above.
          files: |
            installer/Output/InventoryStore-Setup-*.exe
            linux-release/InventoryStore-linux-x64-*.tar.gz
            linux-release/inventorystore-hosted.tar.gz
          generate_release_notes: false
