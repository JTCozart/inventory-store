# Settings for the shared deploy kit (.claude/deploy-kit), used by the hosted servers only. See app.conf.sample there.
# Self-hosting users keep using linux/install.sh and linux/update.sh, which this does not touch.
APP_SLUG=inventorystore
SERVICE_USER=inventorystore

# Single-file publish: the app is this one binary.
BINARY=InventoryStore.App

# The listening port comes from the Proxy__Port setting in the hosted.conf drop-in. This is only the fallback when the
# unit names none.
DEFAULT_PORT=5050

# The database and everything else the app keeps (StateDirectory) lives here, outside the install folder.
DATA_PATHS="/var/lib/inventorystore"

# The service writes only the data path above, so the install folder can be root-owned.
CODE_OWNER=root

# The release has two Linux assets. The public one (InventoryStore-linux-x64-<version>.tar.gz) is for people who host it
# themselves; the kit bundle is named so that update.sh's linux-x64 match can never pick it up.
ASSET_PATTERN=inventorystore-hosted

UPDATE_MINUTE_OFFSET=4
